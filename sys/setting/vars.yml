# 系统级变量定义（system 段，仅非密钥配置）—— 产品默认值
#
# 现场值不要写在这里：写 ops-prj 的 `values/<系统名>/sys_value.yml`。
# 链路：本文件 -> `gops sys update` -> sys/merged_vars.yml
#       -> `gops sys localize`（+ values/ 覆盖）-> 栈根 .env
#
# 容器内端口/路径/服务名是应用契约，直接写在 sys/docker-compose.yml 里。
system:
  # 镜像来自不同仓、各自发版，所以 tag 分开。
  - name: FIELD_REGISTRY
    value: ghcr.io/dayu-sec

  - name: FIELD_API_IMAGE_TAG
    value: v0.6.6-alpha
  - name: FIELD_WEB_IMAGE_TAG
    value: v0.2.5-alpha
  - name: EVIDENCE_IMAGE_TAG
    value: v0.1.15-alpha

  - name: ATLAS_REGISTRY
    value: ghcr.io/dayu-sec
  - name: ATLAS_IMAGE_TAG
    value: v0.3.3

  - name: PG_REGISTRY
    value: docker.io/library
  - name: PG_IMAGE_TAG
    value: '16'

  # 唯一浏览器入口（field-web）。默认只绑回环：TLS 在 web 容器里终结，
  # 证书由 `sys/scripts/init-web-tls.sh <域名>` 生成到 identity/web/。
  - name: WEB_BIND_IP
    value: 127.0.0.1
  - name: WEB_HOST_PORT
    value: 8088
  # 证书 SAN 里的域名（`https://<WEB_DOMAIN>:<WEB_HOST_PORT>/`）。
  # 用 IP 访问时浏览器会报名字不符 —— 证书 SAN 同时带 localhost 与 127.0.0.1。
  - name: WEB_DOMAIN
    value: localhost

  # 证据服务的**写端口**：给平台数据面（wparse http_sink）投递。
  # 默认绑回环；现场改成数据面所在网段的内网地址。
  - name: EVIDENCE_SINK_BIND_IP
    value: 127.0.0.1
  - name: EVIDENCE_SINK_HOST_PORT
    value: 18800
  # 「接入」页展示 / copy 的那条写端点的**主机名**（数据面视角，不是容器内地址）。
  # 每个部署实例不同：数据面看到的本机名 / 内网 IP / 对外域名。
  # 端口不在这里重复 —— 仍由上面的 EVIDENCE_SINK_HOST_PORT 单点决定。
  - name: EVIDENCE_SINK_PUBLIC_HOST
    value: 127.0.0.1

  # 凭据收数监听（field-api 的 mTLS）：`wist-cred` 推摘要到这里。
  # 默认只绑回环；cred 在别的机器时改成内网地址（并确保证书 SAN 对得上）。
  - name: CREDENTIALS_BIND_IP
    value: 127.0.0.1
  - name: CREDENTIALS_HOST_PORT
    value: 18802

  # ── 身份与自注册 ──────────────────────────────────────────────────
  #
  # 认证系统名（= cred 侧那个 peer 的名字）：凭据的 `audience` 不等于它就拒。
  # 每个站点 / 认证系统可能不同（例：`local-field-alpha`）——现场在
  # `values/<系统>/sys_value.yml` 覆盖，不要改 `sys/configs/field-api/cred.toml`。
  - name: FIELD_API_AUDIENCE
    value: wist-field-api

  # cred 的注册入口。留空 = 初始化页上让操作者填；预置后页面只收券。
  # 例：`https://cred.dev.wist.lab:4444`
  - name: FIELD_API_CRED_URL
    value: ''
  # 本机在 cred 眼里的主机名：**必须等于证书 SAN**，也是 cred 拨号的地址。
  # 不填 = 启动就失败（地址渲染成 `https://:18802/…`，签不出可用证书）——有意如此，
  # 不让人拿到一张签给 `""` 或 `localhost` 的证书。例：`field.dev.wist.lab` 或内网 DNS 名。
  - name: FIELD_API_ADVERTISE_HOST
    value: ''
  # cred 入口的信任锚（入口自签时给它的 CA，容器内路径）。
  # 留空 = 不配锚；此时必须把 FIELD_API_CRED_INSECURE_TLS 打开才注册得成功。
  - name: FIELD_API_CRED_CA_FILE
    value: ''
  # 明确跳过入口证书校验（自签且拿不到 CA 时用）。开了就必须核对初始化页返回的
  # `cred_certificate_sha256` 与入口证书指纹。用完建议切回 ca_file。
  - name: FIELD_API_CRED_INSECURE_TLS
    value: 'false'
  # 授权记录强制验签（Ed25519）。cred 在注册成功后会把公钥写进 `/cred/issuer-signing.pub`；
  # 开了但公钥不在 → field-api 启动期就报，不静默降级。
  - name: FIELD_API_REQUIRE_CRED_SIGNATURE
    value: 'false'

  # 证据读端口（容器内，不绑宿主端口，只在 compose 网络里）。
  # 一个来源：evidence 的 `[read].listen_addr`、compose 健康检查、field-api 的 `base_url`
  # 都从这里来；改这里就全改。
  - name: EVIDENCE_READ_PORT
    value: 8443

  # 资产拓扑写端口：给数据面 wparse 投 DSNAP（与证据写端口同一个道理），
  # 默认只绑回环；现场改成数据面所在网段的内网地址。
  - name: ATLAS_INGEST_BIND_IP
    value: 127.0.0.1
  - name: ATLAS_INGEST_HOST_PORT
    value: 18801
  # 同上：资产拓扑写端点展示用的主机名（端口用 ATLAS_INGEST_HOST_PORT）。
  - name: ATLAS_INGEST_PUBLIC_HOST
    value: 127.0.0.1
  # 写探针：往保留租户写一份最小 DSNAP，验「转换 → 落库 → 物化」。
  # off 时 `/healthz` 仍正常，只是没有 probe 块（页面会显示「写探针还没跑过」就不再出现）。
  - name: ATLAS_PROBE
    value: "on"
  - name: ATLAS_PROBE_INTERVAL_SECS
    value: 300

  # 运行指标：VictoriaMetrics。与 wist-gateway-stack 同一套镜像与做法，
  # 区别只是这里的指标**由别处的数据面 remote write 进来**（本栈不跑 wparse）。
  - name: VM_REGISTRY
    value: quay.io/victoriametrics
  - name: VM_IMAGE_TAG
    value: v1.154.0
  - name: VM_BIND_IP
    value: 127.0.0.1
  - name: VM_HOST_PORT
    value: 18428
  # 数据面视角的 VM 主机名（接入页样板里的写端点用）。
  # 与 ATLAS_INGEST_PUBLIC_HOST 同一性质：每个部署实例不同，现场在 values/ 覆盖。
  - name: VM_PUBLIC_HOST
    value: 127.0.0.1
  # 保留期：与网关栈同一档（月度运维窗口）。
  - name: VM_RETENTION
    value: 30d

  # 两个 PG（证据 / 资产生命周期不同，刻意分开）。默认只绑回环，供运维排查。
  - name: PG_BIND_IP
    value: 127.0.0.1
  - name: EVIDENCE_PG_HOST_PORT
    value: 55434
  - name: ATLAS_PG_HOST_PORT
    value: 55435

  - name: EVIDENCE_PG_DB
    value: wist_evidence
  - name: EVIDENCE_PG_USER
    value: evidence
  # 口令只用于本地；现场通过 ops-prj 的 values/ 覆盖（可写 `${SEC_EVIDENCE_PG_PASSWORD}`）。
  # **必须进 vars.yml**：否则 `gops sys localize` 生成的 .env 里没有它，compose 会拿到空串。
  - name: EVIDENCE_PG_PASSWORD
    value: evidence-dev-only
  - name: ATLAS_PG_DB
    value: wist_atlas
  - name: ATLAS_PG_USER
    value: atlas
  - name: ATLAS_PG_PASSWORD
    value: atlas-dev-only

  # 资产拓扑读接口的令牌（atlas 的 `WIST_ATLAS_TOKEN`，BFF 用它去读）。
  # **故意没有产品默认值**：空串 = atlas 启动失败（读接口不允许“谁都能读”）。
  # 现场必须覆盖：`values/<系统>/sys_value.yml` 写一个随机串（可写 `${SEC_ATLAS_API_TOKEN}`）。
  - name: ATLAS_API_TOKEN
    value: ""

  - name: TZ
    value: Asia/Shanghai
