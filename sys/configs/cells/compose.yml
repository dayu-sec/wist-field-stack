# 客户 PG 编排片段的**种子**：这是 `configs/cells/compose.yml` 的入库骨架。
#
# 运行态的那份由 `sys/scripts/init-field-config.sh` 从 `configs/cells/cells.json`
# **全量生成**（`gops sys localize` 的一部分），不要手改运行态那份。它同时负责：
#   - 每个客户一对 postgres（证据库 / 拓扑库）；
#   - 给 `evidence` 追加 `{host_dir}/objects:/data-customers/<cust>/objects`。
#
# 为什么放在 `configs/` 而不是 `sys/`：客户清单是**站点现场态**。
#   `sys/` 整个目录在升级时会被包覆盖 —— 把客户定义写进去，一升级就全没了；
#   `configs/` 在 `sys-prj.yml` 的 `protect` 里，升级不动。
#
# 为什么用 compose 的 `include`：客户的 PG 仍然归编排管（`gops run start` 一起拉起，
#   网络/健康检查/重启策略一致），而不是脚本自己 `docker run` 出一批游离容器。
#
# 没有客户时保持空（`services: {}`）—— 文件必须存在，否则 include 会报
# `no such file or directory`。`init-field-config.sh` 每次 localize 都会重写它
# （含无客户时的这一份），本文件只在「还没跑过 localize」（如 CI 校验）时兜底。
services: {}
