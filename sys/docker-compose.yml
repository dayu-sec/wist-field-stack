# wist-field-stack — 计算区「数据场 · 现场视图」（证据 / 资产拓扑 / 运行指标 / 设备状态）
#
# 角色分工（浏览器只接触 web）：
#   web         field-web：静态托管 + 同源反代（/api → field-api）
#   field-api   只读 API（BFF）：到证据服务的身份、健康聚合、预签名转发、指标查询、资产拓扑代理
#   evidence    wist-evidence：索引 + 对象存储（正文只在计算区与 COS 之间流动）
#   atlas       wist-atlas：资产与拓扑 API（读接口要 Bearer 令牌）
#   metrics     VictoriaMetrics：数据面 remote-write 进来的运行指标
#   两个 PG     证据与资产生命周期不同，刻意分开
#
# 拓扑画布不是独立容器：它已组件化进 field-web（`@dayu-sec/wist-atlas-graph`），
# 数据走 BFF 的 `/api/atlas/*`。没有 `atlas-web` 服务，也没有 `/atlas/` 反代。
#
# 端口（宿主:容器；宿主端口与 BIND_IP 见 sys/setting/vars.yml）：
#   web              ${WEB_BIND_IP}:${WEB_HOST_PORT}:80      唯一浏览器入口
#   evidence（写）    ${EVIDENCE_SINK_BIND_IP}:${EVIDENCE_SINK_HOST_PORT}:8080
#                    给平台数据面 wparse http_sink 投递；**这是唯一需要内网开放的端口**
#   atlas（写）       ${ATLAS_INGEST_BIND_IP}:${ATLAS_INGEST_HOST_PORT}:8080
#                    给数据面 wparse 投 DSNAP（与 evidence 同一个三字段形状）
#   metrics          ${VM_BIND_IP}:${VM_HOST_PORT}:8428
#                    数据面 remote write / 运维查指标
#   evidence-pg      ${PG_BIND_IP}:${EVIDENCE_PG_HOST_PORT}:5432
#   atlas-pg         ${PG_BIND_IP}:${ATLAS_PG_HOST_PORT}:5432
#   evidence（读）/ field-api：只在 compose 网络内，不绑宿主端口
#                    证据读端口是 `${EVIDENCE_READ_PORT}`（与 evidence 配置 / field-api 同一来源）
name: wist-field-stack

services:
  evidence-postgres:
    container_name: wist-field-stack-evidence-postgres
    image: ${PG_REGISTRY}/postgres:${PG_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVIDENCE_PG_DB}
      POSTGRES_USER: ${EVIDENCE_PG_USER}
      POSTGRES_PASSWORD: ${EVIDENCE_PG_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PG_BIND_IP}:${EVIDENCE_PG_HOST_PORT}:5432"
    volumes:
      # 数据落点：默认是命名卷（= 既有行为）；现场可改成带客户 id 的绝对路径
      # （`/srv/wist-field/<cust>/pg/evidence`）——容器 source 写卷名或路径时
      # compose 自己判断，所以同一个变量两种用法。见 sys/setting/vars.yml 的「客户数据落点」。
      - ${EVIDENCE_PG_DATA:-evidence-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVIDENCE_PG_USER} -d ${EVIDENCE_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  atlas-postgres:
    container_name: wist-field-stack-atlas-postgres
    image: ${PG_REGISTRY}/postgres:${PG_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATLAS_PG_DB}
      POSTGRES_USER: ${ATLAS_PG_USER}
      POSTGRES_PASSWORD: ${ATLAS_PG_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PG_BIND_IP}:${ATLAS_PG_HOST_PORT}:5432"
    volumes:
      - ${ATLAS_PG_DATA:-atlas-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATLAS_PG_USER} -d ${ATLAS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  evidence:
    container_name: wist-field-stack-evidence
    image: ${FIELD_REGISTRY}/wist-evidence:${EVIDENCE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      evidence-postgres:
        condition: service_healthy
    environment:
      WIST_EVIDENCE_CONFIG: /etc/wist-evidence/wist-evidence.toml
      WIST_EVIDENCE_SEC_FILE: /sec/sec-value.yml
      # 读监听端口：`wist-evidence.toml` 的 `[read].listen_addr` 由 `gx run localize` **渲染**
      # 成字面量（模板里是 `{{evidence_read_port}}`）。这里继续传是**过渡兜底**：老现场
      # `configs/` 还是 `${EVIDENCE_READ_PORT}` 形态时（渲染被跳过），服务靠它展开。
      EVIDENCE_READ_PORT: ${EVIDENCE_READ_PORT}
      TZ: ${TZ}
    ports:
      # 写端口（明文，只在内网）：数据面 http_sink 直投。
      - "${EVIDENCE_SINK_BIND_IP}:${EVIDENCE_SINK_HOST_PORT}:8080"
    volumes:
      - ./configs/evidence:/etc/wist-evidence:ro
      # 密钥真值（DB URL / COS 凭据 / sink token）：`.wist/sec-value.yml`，0640。
      - ./.wist:/sec:ro
      # 正文落本地目录（`objects.kind = file`）：宿主上能直接 `find` / `zstd -dc` 看，重启不丢。
      # 容器内是 uid 10001，所以这个目录要在 init-stack.sh 里先建好并给到可写（仅开发栈）；
      # `init-stack.sh` 按 `EVIDENCE_OBJECTS_DIR` 建目录（默认 `./data/evidence-objects`）。
      # 生产切 COS（`objects.kind = s3`）时把这块去掉。
      - ${EVIDENCE_OBJECTS_DIR:-./data/evidence-objects}:/var/lib/wist-evidence/objects
    healthcheck:
      # 读监听（P0 明文 + 身份头；mTLS 在 P1），走 busybox，不依赖 curl。
      # 端口跟着 `EVIDENCE_READ_PORT` 走。
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${EVIDENCE_READ_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  atlas:
    container_name: wist-field-stack-atlas
    image: ${ATLAS_REGISTRY}/wist-atlas:${ATLAS_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      atlas-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${ATLAS_PG_USER}:${ATLAS_PG_PASSWORD}@atlas-postgres:5432/${ATLAS_PG_DB}
      # 读接口令牌：没有它 atlas 直接启动失败（`/healthz` 与写入入口不需要）。
      WIST_ATLAS_TOKEN: ${ATLAS_API_TOKEN}
      # 写探针：往保留租户写一份最小 DSNAP，验「转换 → 落库 → 物化」。
      # 关掉就只是没有 probe 块，`/healthz` 仍返回 `{"status":"ok"}`。
      WIST_ATLAS_PROBE: ${ATLAS_PROBE}
      WIST_ATLAS_PROBE_INTERVAL_SECS: ${ATLAS_PROBE_INTERVAL_SECS}
      TZ: ${TZ}
    # 写入端点（`/internal/atlas`）与读接口同一个监听：数据面 POST 到这里。
    ports:
      - "${ATLAS_INGEST_BIND_IP}:${ATLAS_INGEST_HOST_PORT}:8080"
    command: ["postgres-live", "serve", "--listen", "0.0.0.0:8080"]
    healthcheck:
      test: ["CMD-SHELL", "/bin/busybox wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  metrics:
    container_name: wist-field-stack-metrics
    image: ${VM_REGISTRY}/victoria-metrics:${VM_IMAGE_TAG}
    restart: unless-stopped
    command:
      - --retentionPeriod=${VM_RETENTION}
      - --storageDataPath=/storage
      - --search.latencyOffset=0s
    ports:
      - "${VM_BIND_IP}:${VM_HOST_PORT}:8428"
    volumes:
      - ${VM_DATA:-metrics-data}:/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  field-api:
    container_name: wist-field-stack-field-api
    image: ${FIELD_REGISTRY}/wist-field-api:${FIELD_API_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      evidence:
        condition: service_healthy
    environment:
      WIST_FIELD_CONFIG: /etc/wist-field-api/field-api.toml
      WIST_FIELD_SEC_FILE: /sec/sec-value.yml
      # ── 下列变量已由 `gx run localize` 渲染进 `configs/field-api/*.toml` ──
      # 配置里已经是字面量（端口 / 数据面视角的主机名 / 认证系统名 / 收数地址），
      # 现场改它们走 `values/<系统>/sys_value.yml` + `gops sys localize`，**不再改配置文件**。
      # 这里继续传是**过渡兜底**：现场 `configs/` 若还是 0.2.x 的 `${VAR}` 形态
      # （渲染被跳过 / gx 不可用），服务仍能自己展开，不会起不来。0.4.0 会删掉这一组。
      EVIDENCE_READ_PORT: ${EVIDENCE_READ_PORT}
      EVIDENCE_SINK_PUBLIC_HOST: ${EVIDENCE_SINK_PUBLIC_HOST}
      EVIDENCE_SINK_HOST_PORT: ${EVIDENCE_SINK_HOST_PORT}
      ATLAS_INGEST_PUBLIC_HOST: ${ATLAS_INGEST_PUBLIC_HOST}
      ATLAS_INGEST_HOST_PORT: ${ATLAS_INGEST_HOST_PORT}
      METRICS_SINK_PUBLIC_HOST: ${METRICS_SINK_PUBLIC_HOST}
      VM_HOST_PORT: ${VM_HOST_PORT}
      FIELD_API_AUDIENCE: ${FIELD_API_AUDIENCE}
      FIELD_API_ADVERTISE_HOST: ${FIELD_API_ADVERTISE_HOST}
      FIELD_API_CRED_URL: ${FIELD_API_CRED_URL}
      FIELD_API_CRED_CA_FILE: ${FIELD_API_CRED_CA_FILE}
      FIELD_API_CRED_INSECURE_TLS: ${FIELD_API_CRED_INSECURE_TLS}
      FIELD_API_REQUIRE_CRED_SIGNATURE: ${FIELD_API_REQUIRE_CRED_SIGNATURE}
      CREDENTIALS_HOST_PORT: ${CREDENTIALS_HOST_PORT}
      # atlas 读接口的令牌：这个是**真密钥**，配置里是 `${SEC_ATLAS_API_TOKEN}`（不渲染），
      # 由服务用「密钥文件 + 进程环境」展开 —— 所以它不属于上面那组，要一直留着。
      # `SEC_` 前缀只表示“这是秘密”，值仍来自同一个栈变量（现场可写 `${SEC_ATLAS_API_TOKEN}`）。
      SEC_ATLAS_API_TOKEN: ${ATLAS_API_TOKEN}
      TZ: ${TZ}
    ports:
      # 凭据收数监听（mTLS）：`wist-cred` 推摘要过来。没有它就只能用已登记的旧凭据。
      - "${CREDENTIALS_BIND_IP}:${CREDENTIALS_HOST_PORT}:3103"
    volumes:
      - ./configs/field-api:/etc/wist-field-api:ro
      - ./.wist:/sec:ro
      # cred 接入材料：**两种来源**
      #   · `cred.toml` 由栈**渲染**（`sys/configs/field-api/cred.toml.tpl` → `gx.tpl`，
      #     含 [verify] + [init] + [publish]）→ 跑自注册；
      #   · 或者跑了接入命令（join.sh）写好的 [identity] + [verify]。
      # 目录**可写**：自注册成功后本服务把 server.crt / server.key / client-ca.pem 写到这里。
      # 注意：挂到 `/etc/wist-field-api/cred`（只读配置挂载的子目录）会让 docker 在只读层里
      # 建挂载点而失败（`mkdirat ... Read-only file system`）。所以另起一个顶层路径。
      - ./identity/field-api/cred:/cred
      # 栈渲染的 cred.toml（带 setup code / 收数地址）：覆盖目录里的同名文件，只读。
      - ./configs/field-api/cred.toml:/cred/cred.toml:ro
      # 摘要表（只存 sha256）：验证侧私有状态，重启不丢、不进 PG。
      # 默认 `./data/field-api`；多客户时改成 `<根>/<cust>/field-api`（与凭据一一对应）。
      - ${FIELD_API_STORE_DIR:-./data/field-api}:/var/lib/wist-field-api
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    container_name: wist-field-stack-web
    image: ${FIELD_REGISTRY}/wist-field-web:${FIELD_WEB_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      field-api:
        condition: service_healthy
    ports:
      # 443：唯一浏览器入口（TLS 在这里终结 —— 访问令牌是 bearer，不能走明文）。
      - "${WEB_BIND_IP}:${WEB_HOST_PORT}:443"
    volumes:
      # 站点配置由栈提供（镜像里那份是 HTTP 开发版本）。
      - ./configs/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 站点身份：`sys/scripts/init-web-tls.sh` 生成的 web CA + 叶证书。
      - ./identity/web:/certs:ro
    healthcheck:
      # 走 80 的 /healthz（不打后端、不受证书影响）。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  # 卷名随项目名（`wist-field-stack_*`）。0.2.0 改名后旧卷 `wist-console-stack_*`
  # 会留在宿主上不再被引用：确认不需要旧数据后自行 `docker volume rm`。
  evidence-pgdata:
  atlas-pgdata:
  metrics-data:
