name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# 结构对齐 `wist-cred-stack` 的 release.yml（可发布性检查 + 打部署包 + 可选 COS）：
# 本栈同样**不含二进制** —— 三个业务镜像都由 `wist-evidence` / `wist-field-api` /
# `wist-field-web` 各自的流水线推送，atlas 由 `wist-atlas` 推送，所以没有
# 「预编译件按 triple 追加进包」那两步。
jobs:
  # 发布前必须先能「装得起来」：compose 能渲染 + 脚本能过 shellcheck + 回归测试通过。
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 用入库的 `.env.example`（产品默认）渲染：现场 `.env` 是 localize 生成物、不入库。
      # 少一个变量这里就报，避免发出一个「现场一 up 就缺变量」的包。
      - name: Render compose
        run: |
          # `sys/docker-compose.yml` 用 `include` 引入客户 PG 片段（`configs/cells/compose.yml`），
          # 而 `configs/` 是现场态（不入库）—— 这里用入库骨架铺一份，否则 include 找不到文件。
          # `configs/atlas` 同理：atlas 把 `cells.json` 挂在那里（先目录后包，不代表有客户）。
          mkdir -p configs/cells configs/atlas
          cp sys/configs/cells/compose.yml configs/cells/compose.yml
          docker compose --env-file .env.example \
            -f sys/docker-compose.yml --project-directory . config > /dev/null

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y shellcheck)
          ./dev/lint.sh

      # 栈脚本的回归测试（目前钉的是「.env.example 与 sys/merged_vars.yml 逐键一致」；
      # 需要 docker 的用例会自己跳过）。
      - name: Run shell regression tests
        run: |
          set -eu
          fail=0
          for t in dev/tests/*.test.sh; do
            echo "::group::${t}"
            if bash "${t}"; then echo "PASS ${t}"; else echo "::error file=${t}::${t} 失败"; fail=1; fi
            echo "::endgroup::"
          done
          exit "${fail}"

  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— identity/、configs/、values/、.env、.wist/
  # 等现场态已 ignore，天然不入包；sys/merged_vars.yml 是 gops 文档标注「需入库」的文件，
  # 已在仓库里、随 git archive 进包，所以这里不需要跑 gops。
  # 纪律：改了 sys/setting/vars.yml 后，本地跑一次 `gops sys update` 并把 merged_vars.yml
  # 的变更一起提交，否则包里带的是旧值（`dev/tests/env-example-drift.test.sh` 会先拦住）。
  package:
    name: Package deployment bundle
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-field-stack-${GITHUB_REF_NAME}"
          # 注意：**不要**加 --prefix —— gops 解包时会自建同名目录（~/ds-package/<包名>/），
          # 包内再套一层会导致 prj import 找不到 sys/sys_model.yml。
          git archive \
            --format=tar \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          gzip -9 "${bundle}.tar"
          echo "包内关键文件："
          tar -tzf "${bundle}.tar.gz" | grep -E "sys/.*vars\.yml|sys/sys_model\.yml|sys/docker-compose\.yml"
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-field-stack
          path: wist-field-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供现场下载 / 自升级引用。
  release:
    name: Create GitHub Release
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-field-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把同一制品包推到腾讯云对象存储（COS），供按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整个 job 跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload bundle to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-field-stack
          path: pkg

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（latest）"
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
